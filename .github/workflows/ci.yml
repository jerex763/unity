name: CI

on:
  pull_request:
  push:
    branches: [main, codex/mvp-next]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backup-restore:
    name: Backup restore
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: unity_source
          POSTGRES_USER: unity
          POSTGRES_PASSWORD: unity
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U unity -d unity_source"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install backup tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes age postgresql-client shellcheck

      - name: Check shell scripts
        run: shellcheck ops/backup/*.sh ops/deploy/*.sh

      - name: Create restore target
        env:
          PGPASSWORD: unity
        run: createdb --host 127.0.0.1 --username unity unity_restore

      - name: Test encrypted backup and restore
        env:
          SOURCE_DATABASE_URL: postgresql://unity:unity@127.0.0.1:5432/unity_source
          TARGET_DATABASE_URL: postgresql://unity:unity@127.0.0.1:5432/unity_restore
        run: ops/backup/test_restore.sh

  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: unity
          POSTGRES_USER: unity
          POSTGRES_PASSWORD: unity
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U unity -d unity"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://unity:unity@127.0.0.1:5432/unity
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint with Ruff
        run: ruff check .

      - name: Check formatting with Black
        run: black --check .

      - name: Run tests
        run: pytest

      - name: Run permission and privacy contract
        run: pytest tests/test_permission_matrix.py

      - name: Run Django checks
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: python manage.py check

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint with ESLint
        run: npm run lint

      - name: Check formatting with Prettier
        run: npm run format:check

      - name: Run tests
        run: npm test

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser interaction tests
        run: npm run test:e2e

      - name: Build PWA
        run: npm run build

  deployment-image:
    name: Deployment image
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: unity
          POSTGRES_USER: unity
          POSTGRES_PASSWORD: unity
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U unity -d unity"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build deployment image
        run: docker build --tag unity-deployment-smoke .

      - name: Start deployment image
        run: |
          docker run --detach --rm \
            --name unity-deployment-smoke \
            --network host \
            --env PORT=8000 \
            --env DJANGO_SECRET_KEY=ci-deployment-smoke-secret \
            --env DATABASE_URL=postgresql://unity:unity@127.0.0.1:5432/unity \
            --env MIGRATION_DATABASE_URL=postgresql://unity:unity@127.0.0.1:5432/unity \
            --env DJANGO_DATABASE_SSLMODE=disable \
            --env RENDER_EXTERNAL_HOSTNAME=localhost \
            --env RENDER_EXTERNAL_URL=https://localhost \
            unity-deployment-smoke

      - name: Verify same-origin routes and static assets
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent \
              --header 'X-Forwarded-Proto: https' \
              http://localhost:8000/api/health/; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs unity-deployment-smoke
              exit 1
            fi
            sleep 2
          done

          curl --fail --silent --header 'X-Forwarded-Proto: https' \
            http://localhost:8000/ | grep --quiet "<title>Unity</title>"
          curl --fail --silent --header 'X-Forwarded-Proto: https' \
            http://localhost:8000/people/123 | grep --quiet "<title>Unity</title>"
          curl --fail --silent --header 'X-Forwarded-Proto: https' \
            http://localhost:8000/static/admin/css/base.css > /dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header 'X-Forwarded-Proto: https' \
            http://localhost:8000/api/not-a-real-endpoint/)" = "404"

      - name: Show logs after failure
        if: failure()
        run: docker logs unity-deployment-smoke || true

      - name: Stop deployment image
        if: always()
        run: docker stop unity-deployment-smoke || true
