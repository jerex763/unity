<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unity 本轮任务流程</title><style>body{margin:0;font:16px/1.5 system-ui;color:#26302b;background:#e8eeea}header.review{padding:18px 24px;background:white}h1{font-size:24px;margin:0}select{font:inherit;padding:10px;margin:12px 12px 0 0}main.review{padding:20px;overflow:auto}iframe{border:1px solid #ccd7ce;background:#fbf8f1;display:block}</style><header class="review"><h1>Unity · 可靠性与任务流程</h1><p>本轮 Team Lead 决策稿：保留桌面侧栏，手机队列与详情分开；目录按需展开联系渠道；完整资料编辑暂留。虚构内容，静态状态，不连接后端。</p><select id="width"><option>320</option><option>375</option><option selected>390</option><option>430</option><option>1280</option></select><select id="state"><option value="queue">Follow-up 队列</option><option value="detail">任务详情</option><option value="roster">报名名单</option><option value="loading">名单加载中</option><option value="error">名单失败与重试</option><option value="directory">精简目录</option><option value="contacts">目录联系区展开</option><option value="saving">保存中</option><option value="saved">保存成功</option></select></header><main class="review"><iframe title="流程预览"></iframe></main><script>
const css=`*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui;color:#26302b;background:#fbf8f1}.top{height:88px;padding:12px 16px;border-bottom:1px solid #e1e6e2;background:#fbf8f1;position:sticky;top:0;z-index:1}.top b{color:#2f6b4f}.top p{margin:4px 0;font-size:13px}.layout{display:flex}.side{display:none}main{padding:20px 16px 100px;min-width:0;width:100%}h1{font-size:28px;line-height:1.2;margin:12px 0 16px}h2{font-size:19px;margin:0}h3{font-size:16px;margin:0}p{margin:8px 0}.muted{color:#5d6b63;font-size:14px}.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}button,.link{min-height:44px;padding:10px 14px;border:1px solid #ccd7ce;background:white;color:#24543e;border-radius:8px;font:inherit;display:inline-block;text-decoration:none}button.primary{background:#2f6b4f;color:white;border-color:#2f6b4f}.row,.panel{background:white;border:1px solid #e4e8e4;border-radius:12px;padding:16px;margin:12px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.row p{margin:3px 0}.row small{color:#5d6b63}.split{display:grid;gap:20px}.next{font-weight:650}.notice{padding:12px;border-left:4px solid #2f6b4f;background:#e8f0ea}.error{border-color:#a04420;background:#fff0eb}.channel{border-top:1px solid #e4e8e4;padding:12px 0}.value{display:block;overflow-wrap:anywhere;margin:6px 0}.actions{display:flex;flex-wrap:wrap;gap:8px}.nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #ccd7ce;display:flex;justify-content:space-around;padding:12px 2px;font-size:13px}.nav span{padding:8px 4px}.selected{font-weight:700;color:#24543e}input{width:100%;min-height:48px;font:inherit;padding:12px;border:1px solid #bbc8be;border-radius:8px}button:disabled{opacity:.65}label{display:block;margin-bottom:12px} @media(min-width:768px){.side{display:block;width:220px;flex:none;padding:24px;border-right:1px solid #e4e8e4;min-height:calc(100vh - 88px)}.side p{padding:12px}main{max-width:1100px;padding:28px 32px}.nav{display:none}.split{grid-template-columns:minmax(240px,.8fr) minmax(0,1.2fr)}.mobile-back{display:none}h1{font-size:34px}}`;
const queue=`<h2>Priority queue</h2>${[1,2,3,4].map(n=>`<article class="row"><div><h3>Fictional visitor ${n}</h3><small>Due today · In progress</small><p>Agree the next meeting</p></div><span>›</span></article>`).join('')}`;
const contact=`<div class="channel"><b>WhatsApp</b><span class="value">+61 400 000 001</span><div class="actions"><button class="primary">Open WhatsApp</button><button>Copy</button></div></div><div class="channel"><b>Email</b><span class="value">fictional.visitor.international.student@example.test</span><div class="actions"><button>Email</button><button>Copy</button></div></div>`;
function update(){let s=document.querySelector('#state').value,w=+document.querySelector('#width').value;let title='',content='';if(['queue','detail','saving','saved'].includes(s)){title='Follow-ups';const detail=`<a class="link mobile-back">← Back to queue</a><section class="panel"><h2>Fictional visitor 1</h2><p class="next">Next: agree the next meeting</p><p class="muted">Due today · In progress · Alex</p>${s==='saved'?'<p class="notice">Follow-up updated.</p>':''}${s==='saving'?'<label>Outcome<input value="Agreed a meeting" disabled></label><button disabled>Saving…</button>':contact+'<button class="primary">Update follow-up</button>'}</section>`;content=s==='queue'?`<div class="filters"><button class="primary">My follow-ups</button><button>All</button><button>Overdue</button></div>${queue}`:w>=768?`<div class="split"><div>${queue}</div><div>${detail}</div></div>`:detail;}else if(['roster','loading','error'].includes(s)){title='Registrations';content=`<a class="link">← Back to events</a><h2>Fictional community lunch</h2><p class="muted">Friday · Main Hall</p>${s==='loading'?'<p class="notice">Loading registrations…</p>':s==='error'?'<div class="notice error">Could not load registrations.<p>Your event is unchanged.</p><button>Try again</button></div>':[1,2,3].map(n=>`<article class="row"><div><h3>Fictional attendee ${n}</h3><small>Registered</small></div></article>`).join('')}`;}else{title='People';content=`<input aria-label="Search people" placeholder="Search by name…"><div class="filters"><button>All statuses</button><button>All groups</button></div>${[1,2,3].map(n=>`<section class="panel"><div class="row" style="border:0;padding:0"><div><h3>Fictional visitor ${n}</h3><small>Newcomer · Fictional suburb</small></div><span>›</span></div><button>Contact ${s==='contacts'&&n===1?'▴':'▾'}</button>${s==='contacts'&&n===1?contact:''}</section>`).join('')}`;}const f=document.querySelector('iframe');f.style.width=w+'px';f.style.height=(w>=768?900:844)+'px';f.srcdoc=`<!doctype html><html lang="en"><meta name="viewport" content="width=device-width,initial-scale=1"><style>${css}</style><header class="top"><b>Unity</b><p>Fictional Unity Church · Pastor</p></header><div class="layout"><aside class="side"><p>Home</p><p>People</p><p>Events</p><p>Follow-ups</p></aside><main><h1>${title}</h1>${content}</main></div><nav class="nav"><span>Home</span><span>People</span><span>Events</span><span>Follow-ups</span></nav></html>`}document.querySelectorAll('select').forEach(e=>e.onchange=update);update();
</script></html>
